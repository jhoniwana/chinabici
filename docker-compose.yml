services:

  bot:
    build: .
    container_name: chinabici-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - TZ=America/New_York
      - COBALT_URL=http://cobalt-api:9000
      - LIGHTPANDA_URL=ws://lightpanda:9222
      - LOCAL_API_SERVER=${LOCAL_API_SERVER:-}

    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./model.json:/app/model.json

    # GPU access for VAAPI hardware encoding (Intel/AMD iGPU)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "985"

    depends_on:
      - cobalt-api
      - lightpanda
      - bot-api-server

    networks:
      - chinabici-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cobalt-api:
    image: ghcr.io/imputnet/cobalt:10
    container_name: cobalt-api
    restart: unless-stopped

    init: true
    read_only: true

    expose:
      - "9000"

    environment:
      - API_URL=http://cobalt-api:9000/
      - CORS_WILDCARD=1

    labels:
      - com.centurylinklabs.watchtower.scope=cobalt

    networks:
      - chinabici-net

  watchtower:
    image: ghcr.io/containrrr/watchtower
    container_name: watchtower-cobalt
    restart: unless-stopped

    command: --cleanup --scope cobalt --interval 900 --include-restarting

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - chinabici-net

  lightpanda:
    image: lightpanda/browser:nightly
    container_name: lightpanda
    restart: unless-stopped

    expose:
      - "9222"

    networks:
      - chinabici-net

  # Telegram Local Bot API Server — lifts the 50MB upload limit to 2GB.
  # Requires TELEGRAM_API_ID + TELEGRAM_API_HASH from https://my.telegram.org
  bot-api-server:
    image: aiogram/telegram-bot-api:latest
    container_name: bot-api-server
    restart: unless-stopped

    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
      - TELEGRAM_WORK_DIR=/var/lib/telegram-bot-api

    volumes:
      # shared with the bot so FSInputFile paths resolve on both sides
      - ./downloads:/app/downloads
      - ./tg-api-data:/var/lib/telegram-bot-api

    expose:
      - "8081"

    networks:
      - chinabici-net

networks:
  chinabici-net:
    driver: bridge